<!DOCTYPE html>
<html lang="en" id="categories">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
    <title>Categories</title>
    <style>
        @view-transition {
            navigation: auto;
        }
    </style>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
<header class="content-grid">
    <div class="logo">
        <a href="index.html">
            <img src="assets/logo.svg" alt="Cinema Flow Logo" />
        </a>
    </div>
    <div class="profile">
        <button class="button profile-button radius-round" popovertarget="profile-menu">
            <img class="radius-round" src="assets/avatar.png" />
        </button>
        <nav class="profile-menu glass-container" popover="auto" id="profile-menu">
            <ul>
                <li><a href="profile.html">Profile</a></li>
                <li><a href="settings.html">Settings</a></li>
                <li class="theme-switch-container">
                    <div class="theme-switch" role="radiogroup" aria-label="Theme">
                        <label class="theme-option" for="theme-light" title="Light mode">
                            <input type="radio" name="theme" id="theme-light" value="light">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="4"/>
                                <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>
                            </svg>
                            <span>Light</span>
                        </label>
                        <label class="theme-option" for="theme-system" title="System mode">
                            <input type="radio" name="theme" id="theme-system" value="system" checked>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect width="20" height="14" x="2" y="3" rx="2"/>
                                <line x1="8" x2="16" y1="21" y2="21"/>
                                <line x1="12" x2="12" y1="17" y2="21"/>
                            </svg>
                            <span>System</span>
                        </label>
                        <label class="theme-option" for="theme-dark" title="Dark mode">
                            <input type="radio" name="theme" id="theme-dark" value="dark">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
                            </svg>
                            <span>Dark</span>
                        </label>
                    </div>
                </li>
                <li><a href="logout.html">Logout</a></li>
            </ul>
        </nav>
    </div>
</header>
<nav class="main-nav glass-container">
    <ul>
        <li><a href="index.html">Featured</a></li>
        <li><a href="new.html">New</a></li>
        <li class="selected"><a href="categories.html">Categories</a></li>
        <li><a href="search.html">Search</a></li>
    </ul>
</nav>

<main class="content-grid">
    <ul class="masonry categories">
        <li class="card radius-large glass-container-mild category-action">
            <img src="https://images.unsplash.com/photo-1594909122845-11baa439b7bf?auto=format&fit=crop&q=80&w=400" alt="Action" />
            <div class="details">
                <h3>Action</h3>
            </div>
        </li>
        <li class="card double-height glass-container-mild category-comedy">
            <img src="https://images.unsplash.com/photo-1585647347483-22b66260dfff?auto=format&fit=crop&q=80&w=400" alt="Comedy" />
            <div class="details">
                <h3>Comedy</h3>
            </div>
        </li>
        <li class="card radius-large glass-container-mild category-family">
            <img src="https://images.unsplash.com/photo-1478720568477-152d9b164e26?auto=format&fit=crop&q=80&w=400" alt="Family" />
            <div class="details">
                <h3>Family</h3>
            </div>
        </li>
        <li class="card radius-large glass-container-mild category-sci-fi">
            <img src="https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?auto=format&fit=crop&q=80&w=400" alt="Sci-Fi" />
            <div class="details">
                <h3>Sci-Fi</h3>
            </div>
        </li>
        <li class="card double-height radius-large glass-container-mild category-classics">
            <img src="https://images.unsplash.com/photo-1485846234645-a62644f84728?auto=format&fit=crop&q=80&w=400" alt="Classics" />
            <div class="details">
                <h3>Classics</h3>
            </div>
        </li>
        <li class="card radius-large glass-container-mild category-thriller">
            <img src="https://images.unsplash.com/photo-1477332552946-cfb384aeaf1c?auto=format&fit=crop&q=80&w=400" alt="Thriller" />
            <div class="details">
                <h3>Thriller</h3>
            </div>
        </li>
        <li class="card radius-large glass-container-mild category-horror">
            <img src="https://images.unsplash.com/photo-1509248961158-e54f6934749c?auto=format&fit=crop&q=80&w=400" alt="Horror" />
            <div class="details">
                <h3>Horror</h3>
            </div>
        </li>
    </ul>
</main>
</body>
</html>
